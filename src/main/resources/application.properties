# Thresholds for the review flags. These are our own picks - the brief only says "reasonable",
# so they're easy to tweak here without touching the code.
rules.large-amount-threshold=10000
rules.default-daily-limit=5000
rules.velocity-max-transactions=5
rules.velocity-window-minutes=10
server.error.include-message=always

# Always revalidate the page so browsers pick up a new version after a restart
spring.web.resources.cache.cachecontrol.no-cache=true
